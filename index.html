<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4562b">
<meta name="description" content="Планировщик выпечки хлеба: закваска, складывания, холодная ночь, печь.">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хлеб">

<title>Хлеб — планировщик выпечки</title>
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2320; --muted:#7d6c60;
    --line:#e8dfd2; --accent:#a4562b; --green:#4b7d5c;
    --levain:#b07d3a; --autolyse:#4f7d96; --mix:#5d8a5a;
    --fold:#a4562b; --chill:#5a6b96; --bake:#c2452d;
    --shadow:0 1px 2px rgba(60,40,20,.05), 0 8px 24px -16px rgba(60,40,20,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px 0}

  header{margin-bottom:18px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:1;margin:0;
     letter-spacing:-.5px;font-weight:600}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:18px;box-shadow:var(--shadow);margin-bottom:16px}

  /* ---------------- live session ---------------- */
  .live{
    background:linear-gradient(160deg,#2f2723,#3d322b 60%,#4a3a2e);
    color:#fff;border:0;position:relative;overflow:hidden;
  }
  .live::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:radial-gradient(circle,rgba(196,124,66,.28),transparent 70%);
  }
  .live .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.55}
  .live .stage{font-size:22px;font-weight:600;line-height:1.2;margin:5px 0 0;letter-spacing:-.3px}
  .live .stage.small{font-size:17px;font-weight:500;opacity:.85}
  .live .when{font-size:13.5px;opacity:.62;margin-top:3px;font-variant-numeric:tabular-nums}

  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:14px}
  .bar > i{display:block;height:100%;border-radius:99px;
           background:linear-gradient(90deg,#d89a5e,#f0c08a);transition:width .6s linear}

  .cdrow{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;gap:12px}
  .cdrow .cd{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:-.5px}
  .cdrow .cdcap{font-size:12.5px;opacity:.6;text-align:right;line-height:1.25}
  .live.past{background:linear-gradient(160deg,#3f4a41,#4b5c4e)}
  .live.done{background:linear-gradient(160deg,#3f5a48,#4b7d5c)}

  .live-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .lbtn{
    flex:1;min-width:104px;padding:10px 12px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#fff;
    font:inherit;font-size:13.5px;font-weight:500;transition:.15s;
  }
  .lbtn:hover{background:rgba(255,255,255,.2)}
  .lbtn[aria-pressed="true"]{background:rgba(240,192,138,.28);border-color:rgba(240,192,138,.5)}

  /* ---------------- start button ---------------- */
  .startwrap{text-align:center;padding:6px 0 2px}
  .start{
    width:100%;padding:18px;border-radius:14px;border:0;cursor:pointer;
    background:linear-gradient(180deg,#b5652f,#a4562b);color:#fff;
    font:inherit;font-size:18px;font-weight:600;letter-spacing:.2px;
    box-shadow:0 6px 18px -8px rgba(164,86,43,.8);transition:.15s;
  }
  .start:active{transform:translateY(1px)}
  .startsub{font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}

  /* ---------------- mode switch ---------------- */
  .seg{display:flex;background:#f0e9de;border-radius:11px;padding:3px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:8px;
    font:inherit;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.15s}
  .seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,40,20,.12)}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label.fl{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
  input[type=date],input[type=time],input[type=number],select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:#fff;font:inherit;font-size:16px;color:var(--ink);
    -webkit-appearance:none;appearance:none;
  }
  input:focus,select:focus{outline:2px solid #d9b79b;outline-offset:-1px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;
    font:inherit;font-size:13.5px;color:#5c4a3e;cursor:pointer}
  .chip:hover{border-color:#d3bfa8;background:#fffaf3}
  .chip.accent{border-color:#e0c3ab;background:#fdf3ea;color:var(--accent)}

  details.settings{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  details.settings summary{cursor:pointer;font-size:13.5px;color:var(--muted);list-style:none;
    display:flex;align-items:center;gap:7px}
  details.settings summary::-webkit-details-marker{display:none}
  details.settings summary::before{content:"⚙";font-size:13px}
  details.settings .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.4}

  /* ---------------- plan line (collapsed controls) ---------------- */
  .planline{display:flex;align-items:center;gap:10px;justify-content:space-between;
    background:#faf5ec;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    margin-bottom:16px;font-size:13.5px;color:#5c4a3e}
  .planline b{font-variant-numeric:tabular-nums;font-weight:600}
  .planline button{border:0;background:none;color:var(--accent);font:inherit;font-size:13.5px;
    cursor:pointer;text-decoration:underline;padding:2px 0}

  /* ---------------- facts ---------------- */
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
    border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .fact{background:var(--card);padding:12px 14px}
  .fact .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .fact .v{font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .fact .v small{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:5px}

  /* ---------------- timeline ---------------- */
  .dayhead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:26px 0 10px 4px;font-weight:600}
  ol.timeline{list-style:none;margin:0;padding:0;position:relative}
  li.step{display:grid;grid-template-columns:56px 22px 1fr;gap:0;position:relative;padding:9px 0}
  li.step .time{text-align:right;padding-right:10px;padding-top:1px;font-variant-numeric:tabular-nums}
  li.step .time .hm{font-size:16px;font-weight:600;letter-spacing:-.2px}
  li.step .rail{position:relative;display:flex;justify-content:center}
  li.step .rail::before{content:"";position:absolute;top:0;bottom:-18px;width:2px;background:var(--line)}
  li.step:last-child .rail::before{display:none}
  li.step .dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--line);
    margin-top:5px;position:relative;z-index:1}
  li.step .body{padding:0 0 4px 12px}
  .title{font-size:15.5px;font-weight:550;line-height:1.3;display:flex;align-items:baseline;
    gap:8px;flex-wrap:wrap}
  .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .note{font-size:13px;color:#6b5a4e;margin-top:5px;background:#fbf7f0;border-left:2px solid var(--line);
    padding:6px 9px;border-radius:0 6px 6px 0}

  .k-levain .dot{border-color:var(--levain)}    .k-levain .title{color:#7a5522}
  .k-autolyse .dot{border-color:var(--autolyse)} .k-autolyse .title{color:#3c6377}
  .k-mix .dot{border-color:var(--mix)}          .k-mix .title{color:#456b45}
  .k-fold .dot{border-color:var(--fold)}        .k-fold .title{color:#8c4623}
  .k-chill .dot{border-color:var(--chill)}      .k-chill .title{color:#4a5a83}
  .k-bake .dot{border-color:var(--bake)}        .k-bake .title{color:#a83a22}
  .k-done .dot{background:var(--green);border-color:var(--green)}

  li.step.is-now{background:linear-gradient(90deg,rgba(255,255,255,0),#fff6e8 25%,#fff6e8);
    border-radius:10px}
  li.step.is-now .dot{box-shadow:0 0 0 5px rgba(164,86,43,.15);border-color:var(--accent)}
  li.step.is-past{opacity:.5}
  li.step.is-done{opacity:.42}
  li.step.is-done .title{text-decoration:line-through;text-decoration-thickness:1px}

  .chk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
    border-radius:6px;border:1.5px solid #d8cdbe;background:#fff;cursor:pointer;flex:0 0 auto;
    transition:.12s;margin-left:auto}
  .chk::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(-45deg) translateY(-1px);opacity:0;transition:.12s}
  .chk[aria-checked="true"]{background:var(--green);border-color:var(--green)}
  .chk[aria-checked="true"]::after{opacity:1}

  /* ---------------- next bar ---------------- */
  .nextbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(43,35,32,.94);
    color:#fff;backdrop-filter:blur(10px);
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center}
  .nextbar .nb-in{max-width:760px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px}
  .nextbar .left{min-width:0;flex:1}
  .nextbar .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.6}
  .nextbar .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nextbar .cd{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;
    background:rgba(255,255,255,.12);padding:7px 12px;border-radius:9px;white-space:nowrap}
  .nextbar.done{background:rgba(75,125,92,.95)}
  .nextbar.idle{background:rgba(43,35,32,.8)}

  /* ---------------- actions ---------------- */
  .actions{display:flex;gap:10px;margin:22px 0 40px;flex-wrap:wrap}
  .btn{flex:1;min-width:150px;padding:12px;border-radius:11px;border:1px solid var(--line);
    background:#fff;font:inherit;font-size:14.5px;font-weight:500;color:#4a392e;cursor:pointer;
    transition:.15s}
  .btn:hover{border-color:#d3bfa8;background:#fffaf3}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#8f4a25}

  .warn{background:#fdf3e7;border:1px solid #f0d9bd;color:#8a5a25;border-radius:10px;
    padding:10px 12px;font-size:13px;margin-top:14px}
  .warn strong{font-weight:600}

  /* ---------------- toast ---------------- */
  .toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:rgba(43,35,32,.96);color:#fff;padding:11px 16px;border-radius:11px;font-size:14px;
    opacity:0;pointer-events:none;transition:.22s;z-index:40;max-width:calc(100vw - 40px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:480px){
    h1{font-size:28px}
    li.step{grid-template-columns:50px 20px 1fr}
    .wrap{padding:calc(16px + env(safe-area-inset-top)) 16px 0}
    .fact .v{font-size:16.5px}
    .live .stage{font-size:20px}
    .cdrow .cd{font-size:23px}
  }

  @media print{
    body{background:#fff;padding:0}
    .card.controls,.actions,.nextbar,.live,.toast,.planline,.startwrap{display:none!important}
    .card{box-shadow:none;border:0;padding:0}
    li.step{break-inside:avoid;opacity:1!important}
    li.step.is-past,li.step.is-now{opacity:1;background:none}
    .chk{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Хлеб</h1>
    <p>Закваска → складывания → холодная ночь → печь</p>
  </header>

  <!-- live session panel, shown only when a bake is running -->
  <section class="card live" id="liveCard" hidden>
    <div class="lbl" id="liveLbl">Сейчас идёт</div>
    <div class="stage" id="liveStage">—</div>
    <div class="when" id="liveWhen">—</div>
    <div class="bar"><i id="liveBar" style="width:0%"></i></div>
    <div class="cdrow">
      <div class="cd" id="liveCd">—</div>
      <div class="cdcap" id="liveCdCap">до следующего шага</div>
    </div>
    <div class="live-actions">
      <button class="lbtn" id="btnSound" aria-pressed="true">🔔 Звук</button>
      <button class="lbtn" id="btnWake" aria-pressed="false">💡 Экран</button>
      <button class="lbtn" id="btnTimers">⏱ Таймеры</button>
      <button class="lbtn" id="btnReset">✕ Сброс</button>
    </div>
  </section>

  <!-- start (no session) -->
  <section class="card" id="startCard">
    <div class="startwrap">
      <button class="start" id="btnStart">Старт</button>
      <div class="startsub" id="startSub">—</div>
    </div>
  </section>

  <!-- plan line when session running -->
  <div class="planline" id="planLine" hidden>
    <span id="planLineText">—</span>
    <button id="btnEdit">изменить</button>
  </div>

  <section class="card controls" id="controlsCard">
    <div class="seg" role="tablist">
      <button role="tab" id="tabStart" aria-selected="true">От старта</button>
      <button role="tab" id="tabBake" aria-selected="false">К выпечке</button>
    </div>

    <div id="paneStart">
      <div class="row">
        <div>
          <label class="fl" for="startDate">Дата старта</label>
          <input type="date" id="startDate">
        </div>
        <div>
          <label class="fl" for="startTime">Время старта</label>
          <input type="time" id="startTime" step="300">
        </div>
      </div>
    </div>

    <div id="paneBake" hidden>
      <div class="row">
        <div>
          <label class="fl" for="bakeDate">Хлеб из печи</label>
          <input type="date" id="bakeDate">
        </div>
        <div>
          <label class="fl" for="bakeTime">Во сколько</label>
          <input type="time" id="bakeTime" step="300">
        </div>
      </div>
    </div>

    <div class="chips" id="chips">
      <button class="chip" data-preset="now">Сейчас</button>
      <button class="chip" data-preset="14">Старт 14:00</button>
      <button class="chip" data-preset="16">Старт 16:00</button>
      <button class="chip accent" data-preset="bake9">Хлеб к 9:00</button>
    </div>

    <details class="settings">
      <summary id="settingsSummary">Настройки</summary>
      <div class="grid">
        <div>
          <label class="fl" for="levainH">Закваска, ч</label>
          <input type="number" id="levainH" min="0.5" max="12" step="0.5">
        </div>
        <div>
          <label class="fl" for="autolyseLead">Аутолиз, мин до</label>
          <input type="number" id="autolyseLead" min="0" max="300" step="5">
        </div>
        <div>
          <label class="fl" for="rest">Отдых после соли</label>
          <select id="rest">
            <option value="30">30 минут</option>
            <option value="60">60 минут</option>
          </select>
        </div>
        <div>
          <label class="fl" for="foldsN">Складываний</label>
          <input type="number" id="foldsN" min="1" max="8" step="1">
        </div>
        <div>
          <label class="fl" for="every">Интервал, мин</label>
          <input type="number" id="every" min="10" max="120" step="5">
        </div>
        <div>
          <label class="fl" for="bakeOffsetH">Печь через, ч</label>
          <input type="number" id="bakeOffsetH" min="8" max="30" step="0.5">
        </div>
        <div>
          <label class="fl" for="bakeLen">Выпечка, мин</label>
          <input type="number" id="bakeLen" min="20" max="180" step="5">
        </div>
        <div>
          <label class="fl" for="windowH">Окно, ч</label>
          <input type="number" id="windowH" min="0.5" max="6" step="0.5">
        </div>
      </div>
      <p class="hint">Отдых 30 мин — вариант «17:30 первое», 60 мин — «18:00 первое».</p>
    </details>
  </section>

  <section class="card">
    <div class="facts" id="facts"></div>
    <div id="warnBox"></div>
  </section>

  <div id="timelineWrap"></div>

  <div class="actions">
    <button class="btn primary" id="btnTimers2">⏱ Таймеры в iPhone</button>
    <button class="btn" id="btnAlisa">Фразы для Алисы</button>
  </div>
  <div class="actions">
    <button class="btn" id="btnIcs">В календарь (.ics)</button>
    <button class="btn" id="btnCopy">Скопировать план</button>
  </div>
  <div class="actions">
    <button class="btn" id="btnExport">Экспорт</button>
    <button class="btn" id="btnImport">Импорт</button>
    <button class="btn" id="btnPrint">Печать</button>
  </div>
</div>

<div class="nextbar" id="nextbar">
  <div class="nb-in">
    <div class="left">
      <div class="lbl" id="nbLbl">Следующий шаг</div>
      <div class="t" id="nbTitle">—</div>
    </div>
    <div class="cd" id="nbCd">—</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";

/* ================= helpers ================= */
const $ = (s,r=document)=>r.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const MIN = 60000;
const HOUR = 3600000;
const addMin = (d,m)=> new Date(d.getTime()+m*MIN);
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));

function parseLocal(dateStr,timeStr){
  const [Y,M,D] = dateStr.split("-").map(Number);
  const [h,mi]  = timeStr.split(":").map(Number);
  return new Date(Y,M-1,D,h,mi,0,0);
}
function fmtDur(m){
  m = Math.round(m);
  if(m < 60) return `${m} мин`;
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h} ч ${r} мин` : `${h} ч`;
}
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b === 1) return one;
  if(b >= 2 && b <= 4) return few;
  return many;
}
function durPhrase(min){
  if(min % 60 === 0){
    const h = min/60;
    return `${h} ${plural(h,"час","часа","часов")}`;
  }
  return `${min} ${plural(min,"минута","минуты","минут")}`;
}
function fmtCd(ms){
  const total = Math.max(0, Math.round(ms/1000));
  const d = Math.floor(total/86400);
  const h = Math.floor(total%86400/3600);
  const m = Math.floor(total%3600/60);
  const s = total%60;
  if(d > 0) return `${d} д ${h} ч`;
  if(h > 0) return `${h}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}
function dayLabel(d){
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const d0 = new Date(d); d0.setHours(0,0,0,0);
  const diff = Math.round((d0-t0)/86400000);
  if(diff === 0) return "сегодня";
  if(diff === 1) return "завтра";
  if(diff === 2) return "послезавтра";
  if(diff === -1) return "вчера";
  return new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"}).format(d);
}
function fullDate(d){
  return new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",weekday:"short"}).format(d);
}
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}

/* ================= state ================= */
const LS = "bread.planner.v2";
const cfg = {
  levainH:3, autolyseLead:60, rest:30, foldsN:4, every:30,
  bakeOffsetH:18, bakeLen:60, windowH:2
};
const state = {
  mode:"start",
  startDate:null, startTime:"14:00",
  bakeDate:null,  bakeTime:"09:00",
  session:null,            /* { t0: <epoch ms>, startedAt, sound:bool, wake:bool } */
  done:{}
};

(function defaults(){
  const now = new Date();
  const base = new Date(now);
  if(now.getHours() >= 14) base.setDate(base.getDate()+1);
  const t = new Date(); t.setDate(t.getDate()+1); t.setHours(9,0,0,0);
  state.startDate = isoDate(base);
  state.bakeDate  = isoDate(t);
})();

function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS) || "{}");
    if(raw.cfg) Object.assign(cfg, raw.cfg);
    if(raw.state){
      ["mode","startDate","startTime","bakeDate","bakeTime","session","done"].forEach(k=>{
        if(raw.state[k] != null) state[k] = raw.state[k];
      });
    }
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      cfg,
      state:{
        mode:state.mode, startDate:state.startDate, startTime:state.startTime,
        bakeDate:state.bakeDate, bakeTime:state.bakeTime,
        session:state.session, done:state.done
      }
    }));
  }catch(e){}
}

/* ================= schedule ================= */
function computeTimes(){
  if(state.session){
    const start = new Date(state.session.t0);
    return { start, bakeStart: addMin(start, cfg.bakeOffsetH*60) };
  }
  if(state.mode === "start"){
    const start = parseLocal(state.startDate, state.startTime);
    return { start, bakeStart: addMin(start, cfg.bakeOffsetH*60) };
  }
  const bakeStart = parseLocal(state.bakeDate, state.bakeTime);
  return { bakeStart, start: addMin(bakeStart, -cfg.bakeOffsetH*60) };
}

function buildSteps(start, bakeStart){
  const steps = [];
  const levainMin  = cfg.levainH*60;
  const ready      = addMin(start, levainMin);
  const autolyseAt = addMin(ready, -cfg.autolyseLead);
  const firstFold  = addMin(ready, cfg.rest);
  const lastFold   = addMin(firstFold, cfg.every*(cfg.foldsN-1));
  const shapeAt    = addMin(lastFold, cfg.every);
  const preheatAt  = addMin(bakeStart, -45);
  const outAt      = addMin(bakeStart, cfg.bakeLen);
  const windowEnd  = addMin(bakeStart, cfg.windowH*60);

  steps.push({ id:"levain", kind:"levain", at:start, order:0,
    title:"Поставить закваску", meta: fmtDur(levainMin),
    note:`Готова к ${hm(ready)}. За ${fmtDur(cfg.autolyseLead)} до этого — аутолиз.` });

  if(cfg.autolyseLead > 0){
    steps.push({ id:"autolyse", kind:"autolyse", at:autolyseAt, order:1,
      title:"Аутолиз: мука + вода",
      meta:`${fmtDur(cfg.autolyseLead)} отдыха, без соли`,
      note:"Смешать до однородности, накрыть. Закваска и соль — позже." });
  }

  steps.push({ id:"mix", kind:"mix", at:ready, order:2,
    title:"Замес: закваска + соль",
    meta:`отдых ${fmtDur(cfg.rest)} → первое складывание`,
    note:`Соль вносим сейчас. Дальше ${fmtDur(cfg.rest)} покоя.` });

  for(let i=0;i<cfg.foldsN;i++){
    const at = addMin(firstFold, i*cfg.every);
    const last = i === cfg.foldsN-1;
    steps.push({ id:`fold${i+1}`, kind:"fold", at, order:3+i,
      title:`Складывание ${i+1} из ${cfg.foldsN}`,
      meta: last ? "последнее" : `следующее через ${fmtDur(cfg.every)}`,
      note: last ? `После — ${fmtDur(cfg.every)} покоя, формовка и в холодильник.` : "" });
  }

  steps.push({ id:"chill", kind:"chill", at:shapeAt, order:3+cfg.foldsN,
    title:"Формовка → в холодильник",
    meta:`холодная ферментация до ${hm(bakeStart)}`,
    note:`Тесто в холоде ${fmtDur((bakeStart-shapeAt)/MIN)} — это и есть ночь.` });

  steps.push({ id:"preheat", kind:"bake", at:preheatAt, order:20,
    title:"Духовку на разогрев, тесто из холодильника",
    meta:"45 мин на разогрев",
    note:"Достать форму, дать постоять на столе пока греется печь." });

  steps.push({ id:"bake", kind:"bake", at:bakeStart, order:21,
    title:"В печь", meta:`${fmtDur(cfg.bakeLen)} · окно до ${hm(windowEnd)}`,
    note:`Окно выпечки ${hm(bakeStart)}–${hm(windowEnd)}.` });

  steps.push({ id:"done", kind:"done", at:outAt, order:22,
    title:"Готово — достать хлеб", meta:"остудить на решётке минимум 1 ч",
    note:"Резать горячим нельзя — мякиш ещё «варится»." });

  return steps.sort((a,b)=> (a.at-b.at) || (a.order-b.order));
}

/* ================= stage detection ================= */
function stageAt(now, steps){
  let cur = -1;
  for(let i=0;i<steps.length;i++){ if(steps[i].at <= now) cur = i; else break; }
  const next = cur+1 < steps.length ? cur+1 : -1;
  return { cur, next };
}

/* ================= render ================= */
let cur = { steps:[], start:null, bakeStart:null, key:"" };
let lastStageId = null;
let editing = false;

function render(){
  const { start, bakeStart } = computeTimes();
  const steps = buildSteps(start, bakeStart);
  cur = { steps, start, bakeStart, key:String(start.getTime()) };

  renderLive();
  renderStartCard();
  renderPlanLine();
  renderFacts(start, bakeStart, steps);
  renderTimeline(steps);
  renderWarn(start);
  renderNextbar();
  updateSettingsSummary();
  save();
}

function renderStartCard(){
  const showStart = !state.session;
  $("#startCard").hidden = !showStart;
  $("#controlsCard").hidden = !!state.session && !editing;
  $("#planLine").hidden = !state.session;
  $("#btnEdit").textContent = editing ? "свернуть" : "изменить";
  if(showStart){
    const s = parseLocal(state.startDate, state.startTime);
    $("#startSub").textContent =
      `Старт ${hm(s)} ${dayLabel(s)} · в печь ${hm(addMin(s, cfg.bakeOffsetH*60))} ${dayLabel(addMin(s, cfg.bakeOffsetH*60))}`;
  }
}

function renderPlanLine(){
  if(!state.session) return;
  const s = new Date(state.session.t0);
  const b = addMin(s, cfg.bakeOffsetH*60);
  $("#planLineText").innerHTML =
    `Старт <b>${hm(s)}</b> ${dayLabel(s)} → печь <b>${hm(b)}</b> ${dayLabel(b)}`;
}

function renderLive(){
  const card = $("#liveCard");
  const now = Date.now();
  if(!state.session){ card.hidden = true; return; }
  card.hidden = false;

  const steps = cur.steps;
  const { cur:iCur, next:iNext } = stageAt(now, steps);
  const overall0 = cur.start.getTime();
  const overall1 = addMin(cur.bakeStart, cfg.bakeLen).getTime();

  let lbl, stage, when, cd, cdCap, bar;

  if(iCur < 0){
    lbl = "До старта";
    stage = steps[0].title;
    when = `${hm(steps[0].at)} · ${dayLabel(steps[0].at)}`;
    cd = fmtCd(steps[0].at - now);
    cdCap = "до начала";
    bar = 0;
  }else if(iNext < 0){
    lbl = "Готово";
    stage = "Хлеб готов 🍞";
    when = `${hm(steps[iCur].at)} · остудить на решётке`;
    cd = "—";
    cdCap = "можно резать через час";
    bar = 100;
  }else{
    const a = steps[iCur].at, b = steps[iNext].at;
    lbl = `Сейчас · шаг ${iCur+1} из ${steps.length}`;
    stage = steps[iCur].title;
    when = `начат в ${hm(steps[iCur].at)}`;
    cd = fmtCd(b - now);
    cdCap = `до: ${steps[iNext].title}`;
    bar = clamp((now - a) / (b - a) * 100, 0, 100);
  }

  $("#liveLbl").textContent = lbl;
  $("#liveStage").textContent = stage;
  $("#liveWhen").textContent = when;
  $("#liveCd").textContent = cd;
  $("#liveCdCap").textContent = cdCap;
  $("#liveBar").style.width = bar.toFixed(1) + "%";

  card.classList.toggle("done", iNext < 0);
  card.classList.toggle("past", iCur >= 0 && iNext < 0 ? false : false);

  /* beep when the stage changes while the app is open */
  const stageId = iCur < 0 ? "pre" : steps[iCur].id;
  if(lastStageId !== null && stageId !== lastStageId){
    if(state.session.sound !== false) beep();
  }
  lastStageId = stageId;

  $("#btnSound").setAttribute("aria-pressed", state.session.sound !== false);
  $("#btnWake").setAttribute("aria-pressed", !!state.session.wake);
}

function renderFacts(start, bakeStart, steps){
  const folds = steps.filter(s=>s.kind==="fold");
  const chill = steps.find(s=>s.id==="chill");
  const f = [
    ["Старт · закваска", `${hm(start)}<small>${dayLabel(start)}</small>`],
    ["Первое складывание", `${hm(folds[0].at)}<small>${dayLabel(folds[0].at)}</small>`],
    ["Последнее складывание", `${hm(folds[folds.length-1].at)}`],
    ["В холодильник", `${hm(chill.at)}<small>${fmtDur((bakeStart-chill.at)/MIN)} в холоде</small>`],
    ["В печь", `${hm(bakeStart)}<small>${dayLabel(bakeStart)}</small>`],
    ["Всё займёт", `${fmtDur((bakeStart-start)/MIN + cfg.bakeLen)}<small>от старта до хлеба</small>`]
  ];
  $("#facts").innerHTML = f.map(([k,v])=>
    `<div class="fact"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function renderTimeline(steps){
  const now = Date.now();
  const { cur:iCur, next:iNext } = stageAt(now, steps);
  let html = "", lastDay = null;

  steps.forEach((s,i)=>{
    const dk = isoDate(s.at);
    if(dk !== lastDay){
      html += `<div class="dayhead">${fullDate(s.at)} · ${dayLabel(s.at)}</div><ol class="timeline">`;
      lastDay = dk;
    }
    const doneKey = `${cur.key}|${s.id}`;
    const isDone = !!state.done[doneKey];
    const cls = ["step","k-"+s.kind];
    if(isDone) cls.push("is-done");
    else if(i === iCur && state.session) cls.push("is-now");
    else if(s.at.getTime() < now) cls.push("is-past");

    html += `<li class="${cls.join(' ')}" data-id="${s.id}">
      <div class="time"><div class="hm">${hm(s.at)}</div></div>
      <div class="rail"><span class="dot"></span></div>
      <div class="body">
        <div class="title"><span>${s.title}</span>
          <span class="chk" role="checkbox" data-key="${doneKey}"
                aria-checked="${isDone}" tabindex="0" aria-label="Отметить выполненным"></span>
        </div>
        ${s.meta ? `<div class="meta">${s.meta}</div>` : ""}
        ${s.note && !isDone ? `<div class="note">${s.note}</div>` : ""}
      </div>
    </li>`;

    const nxt = steps[i+1];
    if(!nxt || isoDate(nxt.at) !== dk) html += `</ol>`;
  });

  $("#timelineWrap").innerHTML = html;
  $("#timelineWrap").querySelectorAll(".chk").forEach(el=>{
    const toggle = ()=>{
      const k = el.dataset.key;
      if(state.done[k]) delete state.done[k]; else state.done[k] = true;
      save(); render();
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e=>{
      if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); }
    });
  });
}

function renderWarn(start){
  const box = $("#warnBox");
  const now = Date.now();
  if(state.session){
    const end = addMin(cur.bakeStart, cfg.bakeLen).getTime();
    if(now > end + 12*HOUR){
      box.innerHTML = `<div class="warn"><strong>Это план от ${dayLabel(start)}.</strong>
        Похоже, выпечка уже давно прошла. Нажмите «Сброс» и поставьте новый старт.</div>`;
    }else{ box.innerHTML = ""; }
    return;
  }
  if(start.getTime() < now - 3*HOUR){
    box.innerHTML = `<div class="warn">Старт уже прошёл (${hm(start)}, ${dayLabel(start)}).
      Сдвиньте время или переключитесь в «К выпечке».</div>`;
  }else{ box.innerHTML = ""; }
}

function renderNextbar(){
  const now = Date.now();
  const bar = $("#nextbar");
  const steps = cur.steps;

  if(!state.session){
    const nx = steps.find(s=>s.at.getTime() > now);
    bar.classList.add("idle");
    bar.classList.remove("done");
    $("#nbLbl").textContent = "План не запущен";
    $("#nbTitle").textContent = nx ? `Старт ${hm(steps[0].at)} · ${dayLabel(steps[0].at)}` : "—";
    $("#nbCd").textContent = nx ? fmtCd(nx.at - now) : "—";
    return;
  }
  bar.classList.remove("idle");
  const nx = steps.find(s=>s.at.getTime() > now);
  if(!nx){
    bar.classList.add("done");
    $("#nbLbl").textContent = "План выполнен";
    $("#nbTitle").textContent = "Хлеб готов 🍞";
    $("#nbCd").textContent = "—";
    return;
  }
  bar.classList.remove("done");
  $("#nbLbl").textContent = dayLabel(nx.at) === "сегодня" ? "Следующий шаг" : `Дальше · ${dayLabel(nx.at)}`;
  $("#nbTitle").textContent = `${hm(nx.at)} — ${nx.title}`;
  $("#nbCd").textContent = fmtCd(nx.at - now);
}

function updateSettingsSummary(){
  const w = cfg.foldsN % 10 === 1 && cfg.foldsN !== 11 ? "складывание" : "складывания";
  $("#settingsSummary").textContent =
    `Закваска ${cfg.levainH} ч · отдых ${cfg.rest} мин · ${cfg.foldsN} ${w} через ${cfg.every} мин · печь через ${cfg.bakeOffsetH} ч`;
}

/* ================= audio ================= */
let actx = null;
function unlockAudio(){
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = new AC();
    }
    if(actx.state === "suspended") actx.resume();
  }catch(e){}
}
function beep(){
  if(!actx) return;
  const now = actx.currentTime;
  [0, 0.22].forEach((off, k)=>{
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "sine";
    o.frequency.value = k === 0 ? 880 : 1180;
    g.gain.setValueAtTime(0.0001, now + off);
    g.gain.exponentialRampToValueAtTime(0.28, now + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(now + off);
    o.stop(now + off + 0.2);
  });
  if(navigator.vibrate) navigator.vibrate([90,70,90]);
}

/* ================= wake lock ================= */
let wakeLock = null;
async function acquireWake(){
  try{
    if(!("wakeLock" in navigator)){ toast("Wake Lock не поддерживается"); return false; }
    if(document.visibilityState !== "visible") return false;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ /* re-acquired on visibility change */ });
    return true;
  }catch(e){ return false; }
}
function releaseWake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && state.session && state.session.wake){
    acquireWake();
  }
});

/* ================= session control ================= */
$("#btnStart").addEventListener("click", ()=>{
  unlockAudio();
  const s = parseLocal(state.startDate, state.startTime);
  let t0 = s.getTime();
  const now = Date.now();
  if(t0 < now - 15*MIN){
    t0 = now;
    toast("Время старта было в прошлом — начали с текущего момента");
  }
  state.session = { t0, startedAt: now, sound: true, wake: false };
  state.done = {};
  editing = false;
  lastStageId = null;
  render();
  toast("План запущен. Следите за полосой прогресса");
  if(state.session.wake) acquireWake();
});

$("#btnEdit").addEventListener("click", ()=>{
  editing = !editing;
  render();
  if(editing){
    setTimeout(()=> $("#controlsCard").scrollIntoView({behavior:"smooth", block:"start"}), 60);
  }
});

$("#btnSound").addEventListener("click", ()=>{
  if(!state.session) return;
  unlockAudio();
  state.session.sound = state.session.sound === false ? true : false;
  render();
  if(state.session.sound) beep();
});

$("#btnReset").addEventListener("click", ()=>{
  const ok = window.confirm
    ? window.confirm("Сбросить текущую выпечку? План вернётся к настройкам.")
    : true;
  if(!ok) return;
  releaseWake();
  state.session = null;
  state.done = {};
  lastStageId = null;
  editing = false;
  syncInputs();
  render();
  toast("Сброшено");
});

$("#btnWake").addEventListener("click", async ()=>{
  if(!state.session) return;
  if(state.session.wake){
    state.session.wake = false;
    releaseWake();
  }else{
    state.session.wake = true;
    const ok = await acquireWake();
    if(!ok) state.session.wake = false;
  }
  render();
});

/* ================= Shortcuts / Alisa ================= */
function pendingFolds(){
  const now = Date.now();
  return cur.steps.filter(s=> s.kind === "fold" && s.at.getTime() > now + 30*1000);
}
/* Minutes from now — the Shortcut only has to start N timers. */
function foldDurations(){
  const now = Date.now();
  return pendingFolds().map(s=> Math.max(1, Math.round((s.at.getTime()-now)/MIN)));
}
function timersUrl(){
  const dur = foldDurations().join(",");
  const name = "Хлеб таймеры";
  return `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${encodeURIComponent(dur)}`;
}
function timers(){
  const d = foldDurations();
  if(!d.length){ toast("Складывания уже прошли"); return; }
  const a = document.createElement("a");
  a.href = timersUrl();
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast(`Команда запущена · ${d.length} таймера: ${d.join(", ")} мин`);
}
$("#btnTimers").addEventListener("click", timers);
$("#btnTimers2").addEventListener("click", timers);

$("#btnAlisa").addEventListener("click", async ()=>{
  const steps = cur.steps;
  const folds = steps.filter(s=>s.kind==="fold");
  const bake = cur.bakeStart;
  const lines = [
    "Фразы для Алисы (по порядку):",
    `1. «Алиса, поставь таймер на ${durPhrase(cfg.levainH*60)}»   ← закваска`,
    `2. «Алиса, поставь таймер на ${durPhrase(cfg.autolyseLead)}»   ← аутолиз`,
    `3. «Алиса, поставь таймер на ${durPhrase(cfg.rest)}»   ← отдых после соли`,
    `4. «Алиса, поставь таймер на ${durPhrase(cfg.every)}»   ← складывание 1`,
    `5. «Алиса, повтори таймер»   ← складывание 2`,
    `6. «Алиса, повтори таймер»   ← складывание 3`,
    `7. «Алиса, повтори таймер»   ← складывание 4`,
    `8. «Алиса, напомни завтра в ${hm(bake)} поставить хлеб в печь»`
  ];
  await copyText(lines.join("\n"), "Фразы скопированы");
});

/* ================= export ================= */
async function copyText(text, okMsg){
  try{
    await navigator.clipboard.writeText(text);
    toast(okMsg || "Скопировано");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); toast(okMsg || "Скопировано"); }
    catch(err){ toast("Не удалось скопировать"); }
    ta.remove();
  }
}

function planText(){
  const { start, bakeStart } = cur;
  const lines = [`Хлеб: старт ${fullDate(start)} в ${hm(start)}`, ""];
  cur.steps.forEach(s=>{
    lines.push(`${hm(s.at)} — ${s.title}${s.meta ? " ("+s.meta+")" : ""}`);
  });
  lines.push("", `В печь ${hm(bakeStart)} ${dayLabel(bakeStart)}.`);
  return lines.join("\n");
}
$("#btnCopy").addEventListener("click", ()=> copyText(planText(), "План скопирован"));
$("#btnPrint").addEventListener("click", ()=> window.print());

function icsEscape(s){
  return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}
function icsDate(d){
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
$("#btnIcs").addEventListener("click", ()=>{
  const stampUtc = `${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`;
  const out = ["BEGIN:VCALENDAR","VERSION:2.0","CALSCALE:GREGORIAN",
               "PRODID:-//bread planner//RU","METHOD:PUBLISH"];
  cur.steps.forEach((s,i)=>{
    const mins = s.kind === "levain" ? cfg.levainH*60 : (s.kind === "bake" ? cfg.bakeLen : 15);
    const end = addMin(s.at, mins);
    out.push("BEGIN:VEVENT",
      `UID:bread-${cur.start.getTime()}-${i}@local`,
      `DTSTAMP:${stampUtc}`,
      `DTSTART:${icsDate(s.at)}`,
      `DTEND:${icsDate(end)}`,
      `SUMMARY:${icsEscape("Хлеб · " + s.title)}`,
      `DESCRIPTION:${icsEscape((s.meta||"") + (s.note ? "\n" + s.note : ""))}`,
      "BEGIN:VALARM","TRIGGER:-PT5M","ACTION:DISPLAY",
      `DESCRIPTION:${icsEscape("Хлеб · " + s.title)}`,
      "END:VALARM","END:VEVENT");
  });
  out.push("END:VCALENDAR");
  download(new Blob([out.join("\r\n")], {type:"text/calendar;charset=utf-8"}),
           `bread-${isoDate(cur.start)}.ics`);
  toast("Файл календаря готов");
});

function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

$("#btnExport").addEventListener("click", ()=>{
  const data = { version:2, exportedAt:new Date().toISOString(), cfg, state };
  download(new Blob([JSON.stringify(data,null,2)], {type:"application/json"}),
           `bread-backup-${isoDate(new Date())}.json`);
  toast("Резервная копия сохранена");
});
$("#btnImport").addEventListener("click", ()=> $("#fileIn").click());
$("#fileIn").addEventListener("change", async (e)=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(data.cfg) Object.assign(cfg, data.cfg);
    if(data.state){
      ["mode","startDate","startTime","bakeDate","bakeTime","session","done"]
        .forEach(k=>{ if(data.state[k] != null) state[k] = data.state[k]; });
    }
    lastStageId = null;
    syncInputs(); render();
    toast("План восстановлен");
  }catch(err){
    toast("Не удалось прочитать файл");
  }
  e.target.value = "";
});

/* ================= controls ================= */
function syncInputs(){
  $("#startDate").value = state.startDate;
  $("#startTime").value = state.startTime;
  $("#bakeDate").value  = state.bakeDate;
  $("#bakeTime").value  = state.bakeTime;
  $("#levainH").value = cfg.levainH;
  $("#autolyseLead").value = cfg.autolyseLead;
  $("#rest").value = String(cfg.rest);
  $("#foldsN").value = cfg.foldsN;
  $("#every").value = cfg.every;
  $("#bakeOffsetH").value = cfg.bakeOffsetH;
  $("#bakeLen").value = cfg.bakeLen;
  $("#windowH").value = cfg.windowH;

  $("#tabStart").setAttribute("aria-selected", state.mode === "start");
  $("#tabBake").setAttribute("aria-selected", state.mode === "bake");
  $("#paneStart").hidden = state.mode !== "start";
  $("#paneBake").hidden  = state.mode !== "bake";
}

$("#tabStart").addEventListener("click", ()=>{ state.mode="start"; syncInputs(); render(); });
$("#tabBake").addEventListener("click",  ()=>{ state.mode="bake";  syncInputs(); render(); });

["startDate","startTime","bakeDate","bakeTime"].forEach(id=>{
  ["input","change"].forEach(ev=> $("#"+id).addEventListener(ev, e=>{
    state[id] = e.target.value;
    if(state.session){ state.session = null; lastStageId = null; }
    render();
  }));
});

[["levainH","levainH"],["autolyseLead","autolyseLead"],["foldsN","foldsN"],
 ["every","every"],["bakeOffsetH","bakeOffsetH"],["bakeLen","bakeLen"],["windowH","windowH"]]
.forEach(([id,key])=>{
  $("#"+id).addEventListener("input", e=>{
    const v = parseFloat(e.target.value);
    if(!isNaN(v) && v > 0){ cfg[key] = v; render(); }
  });
});
$("#rest").addEventListener("change", e=>{ cfg.rest = parseInt(e.target.value,10); render(); });

$("#chips").addEventListener("click", e=>{
  const btn = e.target.closest("[data-preset]");
  if(!btn) return;
  const p = btn.dataset.preset;
  const now = new Date();
  if(p === "now"){
    const d = new Date(now);
    d.setMinutes(Math.ceil(d.getMinutes()/15)*15, 0, 0);
    state.mode = "start"; state.startDate = isoDate(d); state.startTime = hm(d);
  }
  if(p === "14" || p === "16"){
    const t = p === "14" ? 14 : 16;
    const d = new Date(now);
    if(now.getHours() >= t) d.setDate(d.getDate()+1);
    d.setHours(t,0,0,0);
    state.mode = "start"; state.startDate = isoDate(d); state.startTime = hm(d);
  }
  if(p === "bake9"){
    const d = new Date(now);
    d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
    if(addMin(d, -cfg.bakeOffsetH*60) < now) d.setDate(d.getDate()+1);
    state.mode = "bake"; state.bakeDate = isoDate(d); state.bakeTime = "09:00";
  }
  state.session = null;
  lastStageId = null;
  syncInputs();
  render();
});

/* ================= boot ================= */
load();
syncInputs();
render();

setInterval(()=>{ renderLive(); renderNextbar(); }, 1000);

/* unlock audio on the first touch anywhere (iOS requirement) */
["pointerdown","touchstart","click"].forEach(ev=>
  document.addEventListener(ev, ()=> unlockAudio(), {once:true, passive:true}));

/* register service worker only in a secure context */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
})();
</script>
</body>
</html>
